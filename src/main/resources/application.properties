spring.application.name=account-service
server.port=${SERVER_PORT:8090}
spring.datasource.url=${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/lab_batch}
spring.datasource.username=${ACCOUNT_DB_USERNAME:root}
spring.datasource.password=${ACCOUNT_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

spring.cloud.config.enabled=false
eureka.client.enabled=false
